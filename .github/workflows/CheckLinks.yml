name: Check links
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    # Check the deployed site instead of rebuilding it
    - name: Checkout deployed site
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: site
    - name: Check links
      id: lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: --no-progress --config lychee.toml --root-dir ${{ github.workspace }}/site site
        fail: false
    # Update the open issue if there is one, so we don't get a new one every week
    - name: Find open issue
      id: issue
      if: steps.lychee.outputs.exit_code != 0
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        number=$(gh issue list --state open --search 'in:title "Broken links"' --json number --jq '.[0].number // empty')
        echo "number=$number" >> "$GITHUB_OUTPUT"
    - name: Open or update issue
      if: steps.lychee.outputs.exit_code != 0
      uses: peter-evans/create-issue-from-file@v6
      with:
        title: Broken links
        content-filepath: ./lychee/out.md
        issue-number: ${{ steps.issue.outputs.number }}
