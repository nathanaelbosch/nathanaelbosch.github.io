# Config for lychee, the link checker used by `just check-links` and the
# "Check links" workflow. Docs: https://lychee.cli.rs/guides/config/

# Only check the generated pages, not the vendored CSS and JS
extensions = ["html"]

# Resolve directory links like /publications/ to their index.html
index_files = ["index.html"]

# Retry flaky requests, and don't count rate limiting as a broken link
max_retries = 3
accept = ["200..=299", "429"]

# Sites that block automated requests, so their links always look broken
exclude = [
  '^https://(www\.)?linkedin\.com/',
  '^https://scholar\.google\.com/',
  '^https://(www\.)?siam\.org/',
  # Canonical URL of the 404 page, which doesn't exist by design
  '^https://nathanaelbosch\.github\.io/404/$',
]
